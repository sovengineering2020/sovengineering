  const nonPieceAssigned=works.some(w=>normalizeWorkType(w.workType)!=='PIECE'&&assignedIds(w).length>0);
  const hasNonPiece=works.some(w=>normalizeWorkType(w.workType)!=='PIECE');
  const headerStatus=complete?'Completed':'Ongoing';
  const headerBadge=complete?'badge-green':'badge-blue';
  const imgHtml=pieceWorks.length? (job.image?`<img class="wo-img" src="${job.image}" alt="${job.partName}" data-lightbox="${job.image}">`:`<div class="wo-img-empty">No image</div>`) : '';
  const workRows=works.map((w,wi)=>{
    const baseDone=w.workType==='PIECE'?Number(w.completed||0):null;
    const draftKey=`${job.id}:${w.id}`;
    const draftDone=w.workType==='PIECE'&&isAdmin&&state.adminCountDrafts?.[draftKey]!=null?Number(state.adminCountDrafts[draftKey]):baseDone;
    const done=w.workType==='PIECE'?draftDone:null;
    const workTotal=w.workType==='PIECE'?workTotalRequired(job,w):null;
    const rem=w.workType==='PIECE'&&workTotal!=null?Math.max(0,workTotal-done):null;
    const status=String(w.status||'ACTIVE').toUpperCase();
    const countControls=w.workType==='PIECE'&&isAdmin?`<div class="work-count-inline"><div class="qty-control"><button type="button" class="btn btn-ghost qty-btn" data-admin-qty-dec="${job.id}:${w.id}" aria-label="Decrease completed count" ${done<=0?'disabled':''}>−</button><span class="qty-value" data-admin-qty-value="${job.id}:${w.id}">${done}</span><button type="button" class="btn btn-ghost qty-btn" data-admin-qty-inc="${job.id}:${w.id}" aria-label="Increase completed count" ${done>=workTotal?'disabled':''}>+</button></div>${draftDone!==baseDone?`<button type="button" class="btn btn-primary btn-sm" data-admin-qty-update="${job.id}:${w.id}">Update</button>`:''}</div>`:'';
    const nonPieceStatus='';
    return `<div class="work-list-row"><div style="min-width:0;flex:1"><b>${wi+1}. ${w.workType==='PIECE'?workLabel(w,job):(w.workType==='NO_FIXED'?'No Fixed Total Pieces':'Count Not Applicable / Work-Based')}</b>${nonPieceStatus}${countControls}</div>${isAdmin?`<div class="work-row-actions"><button class="btn btn-ghost btn-sm" data-assign-work="${job.id}" data-work-id="${w.id}">Assign</button>${w.workType==='PIECE'?`<button class="btn btn-ghost btn-sm" data-edit-daily-count="${job.id}" data-work-id="${w.id}">Edit</button>`:`<button class="btn btn-ghost btn-sm" data-edit-daily-work="${job.id}" data-work-id="${w.id}">Edit Daily Record</button>`}</div>`:''}</div>`;
  }).join('');
  const relationshipMeta=isPurchaseOrderPiecesJob(job)?` · Purchase Order: ${commonDashboardEscape(job.customerPoNumber||'—')}`:isStandalonePiecesJob(job)?' · Standalone Pieces Based':(job.customerDcNumber?` · Customer DC: ${commonDashboardEscape(job.customerDcNumber)}`:'');
  return `<div class="wo-card"><div class="wo-top">${imgHtml}<div><div class="wo-id">JOB-${String(idx+1).padStart(4,'0')} · ${fmtDate(job.date)} · <span class="badge ${headerBadge}">${headerStatus}</span></div><div class="wo-title"><span style="color:var(--steel)">${job.partName||'Unnamed Part'}</span></div><div class="wo-meta">${works.length} Work${works.length===1?'':'s'}${relationshipMeta} · ${job.instructions||'No instructions'}${isAdmin?` · <button class="icon-btn" style="width:auto;height:auto;padding:2px 6px;border:none;color:var(--steel)" data-edit-job="${job.id}">Edit</button> <button class="icon-btn" style="width:auto;height:auto;padding:2px 6px;border:none;color:var(--red)" data-del-work="${job.id}">Delete</button>`:''}</div></div></div>${pieceWorks.length?`<div class="wo-progress-wrap"><div class="wo-progress-stats"><div class="wo-progress-stat wo-progress-total"><span>Total</span><b>${total}</b></div><div class="wo-progress-stat wo-progress-completed"><span>Completed</span><b>${progress.completedPct}%</b></div><div class="wo-progress-stat wo-progress-remaining"><span>Remaining</span><b>${progress.remainingPct}%</b></div></div></div>`:''}<div class="panel" style="margin:12px 0 0;padding:14px 16px;background:var(--panel-alt);"><div class="panel-head" style="margin-bottom:10px"><h3 style="font-size:1rem">Works &amp; Progress</h3></div>${workRows||'<div class="sub">No Works added.</div>'}</div></div>`;
}

/* ---------------- ADMIN EVENTS ---------------- */

function attachAdminEvents(){
  // Fail closed: controls remain hidden until the server explicitly enables them.
  let adminFeatureFlags={jsonBackup:false};
  const backupJsonBtn=document.getElementById('json-backup-btn');
  const backupDownloadBtn=document.getElementById('json-backup-download-btn');
  const backupStatus=document.getElementById('json-backup-status');
  const renderBackupStatus=data=>{
    if(!backupStatus||!adminFeatureFlags.jsonBackup)return;
    if(data&&data.available){
      const yearly=Array.isArray(data.yearlyJsonBackups)?data.yearlyJsonBackups.map(item=>item.filename||item.path).filter(Boolean):[];
      backupStatus.textContent=`Repository: ${data.repository}\nFolder: backup/\nBackup: ${data.createdAt||'verified'}\nZIP: ${data.archivePath||''}\nYear-wise JSON: ${yearly.length?yearly.join(', '):'Included in verified backup archive'}\nStatus: ${data.syncStatus||'verified-on-github'}`;
      if(backupDownloadBtn)backupDownloadBtn.style.display='block';
    }else{
      backupStatus.textContent=`Repository: ${data?.repository||'not configured'}\nFolder: backup/\nStatus: ${data?.syncStatus||'not checked'}`;
      if(backupDownloadBtn)backupDownloadBtn.style.display='none';
    }
  };
  const refreshBackupStatus=async()=>{
    try{const response=await fetch(SOV_API_BASE_URL+'/api/admin/json-backup/status',{headers:authHeaders()});const data=await response.json().catch(()=>({}));if(response.ok&&data.ok)renderBackupStatus(data);else if(backupStatus)backupStatus.textContent='GitHub backup status could not be verified.';}
    catch(error){if(backupStatus)backupStatus.textContent='GitHub backup status could not be verified.';console.warn('JSON backup status check failed:',error);}
  };
  if(backupJsonBtn) backupJsonBtn.addEventListener('click',async()=>{
    if(backupJsonBtn.disabled)return;
    if(!window.confirm('Create and verify a persistent JSON backup in the configured GitHub repository under backup/? The ZIP, manifest, and encrypted versioned files named sov_YYYY_backup_DATE_vN.json will be committed and read back before success is reported.'))return;
    backupJsonBtn.disabled=true; const original=backupJsonBtn.textContent; backupJsonBtn.textContent='Backing up to GitHub…';
    try{
      const response=await fetch(SOV_API_BASE_URL+'/api/admin/json-backup',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:'{}'});
      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.ok)throw new Error((data.error||'GitHub JSON backup failed.')+(data.detail?' '+data.detail:'')+(Array.isArray(data.failedFiles)&&data.failedFiles.length?' Failed files: '+data.failedFiles.map(x=>x.file).join(', '):''));
      renderBackupStatus({available:true,repository:data.repository,createdAt:data.createdAt,archivePath:data.archivePath,yearlyJsonBackups:data.yearlyJsonBackups,syncStatus:data.syncStatus});
      showToast(`GitHub JSON backup verified: ${data.copiedFiles} stored JSON files and ${(data.yearlyJsonBackups||[]).length} versioned year-wise backup(s). Repository: ${data.repository}; folder: backup/.`);
    }catch(error){console.error('GitHub JSON backup request failed:',error);showToast(error.message||'GitHub JSON backup failed.');await refreshBackupStatus();}
    finally{backupJsonBtn.disabled=false;backupJsonBtn.textContent=original;}
  });
  if(backupDownloadBtn) backupDownloadBtn.addEventListener('click',async()=>{
    if(backupDownloadBtn.disabled)return;
    backupDownloadBtn.disabled=true;const original=backupDownloadBtn.textContent;backupDownloadBtn.textContent='Verifying download…';
    try{
      const response=await fetch(SOV_API_BASE_URL+'/api/admin/json-backup/download',{headers:authHeaders()});
      if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error((data.error||'Backup download failed.')+(data.detail?' '+data.detail:''));}

async function punch(empId, direction){
  const date = todayStr();
  let rec = state.attendance.find(a=>a.employeeId===empId && a.date===date);
  if(direction==='in' && rec && rec.inTime){ showToast('Already clocked in today'); return; }
  if(direction==='out' && (!rec || !rec.inTime)){ showToast('Clock in first'); return; }
  if(direction==='out' && rec.outTime){ showToast('Already clocked out today'); return; }
  if(!rec){ rec = {id:uid('att'), employeeId:empId, date, inTime:'', outTime:''}; state.attendance.push(rec); }
  if(direction==='in') rec.inTime = normalizeTimeValue(nowTimeStr());
  if(direction==='out') rec.outTime = normalizeTimeValue(nowTimeStr());
  rec.updatedAt = new Date().toISOString();
  const saved=await persist('attendance','fl_attendance');
  if(saved) showToast(direction==='in' ? 'Marked in' : 'Marked out');
}

function commonDashboardEscape(value){ return String(value??'—').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function inwardTotalAmount(record){ return invoiceMoney(invoiceItemsNormalized(record).reduce((sum,item)=>sum+(Number.isFinite(Number(item?.amount))?Number(item.amount):0),0)); }

function dashboardTransactionDate(record){
  const savedMode=String(record?.outwardDateMode||'').toUpperCase();
  if(savedMode==='TODAY'){
    const savedToday=String(record?.outwardDashboardDate||'').slice(0,10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(savedToday)) return savedToday;
    const source=record?.createdAt||record?.updatedAt||record?.date||'';
    const raw=String(source||'');
    if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
    const parsed=new Date(raw);
    if(!Number.isNaN(parsed.getTime())){
      const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(parsed);
      const m=Object.fromEntries(parts.map(x=>[x.type,x.value]));
      return `${m.year}-${m.month}-${m.day}`;
    }
  }
  // Backward-compatible legacy records and Mentioned Date use the existing transaction date.
  return String(record?.date||'').slice(0,10);
}
function dashboardOutwardRecords(records, selectedDate){
  const date=String(selectedDate||todayStr()).slice(0,10);
  return (Array.isArray(records)?records:[]).filter(x=>String(x?.type||'').toUpperCase()==='OUTWARD' && dashboardTransactionDate(x)===date);
}

function workerDashboard(worker){
  const selectedDate=state.workerDashDate||todayStr();
  const today=todayStr();
  const isFuture=selectedDate>today;
  const isHistorical=selectedDate<today;
  const attendance=state.attendance.find(a=>String(a.employeeId)===String(worker.id)&&a.date===selectedDate);
  const rows=[];
  const dashboardEntries=allWorkerWorkEntries(); dashboardEntries.forEach(({job,work})=>{
    if(!workAssignedTo(work,worker.id)) return;
    const key=`${selectedDate}:${worker.id}`;
    const count=workCompletedForDate(work,selectedDate,worker.id);
    const type=normalizeWorkType(work.workType);
    const dayRec=(work.workDayRecords||{})[key]||{};
    const activity=workActivityForDate({...work,__jobWorks:workEntries(job)},selectedDate).get(String(worker.id));
    const hasRecord=!!activity&&(activity.directPresent||activity.worked||activity.hasActivity)||Object.prototype.hasOwnProperty.call(work.dailyCompleted||{},key)||Object.prototype.hasOwnProperty.call(work.workDayRecords||{},key)||(work.completionHistory||[]).some(item=>String(item?.date||'').slice(0,10)===selectedDate&&String(item?.employeeId||'')===String(worker.id));
    const isScheduled=isFuture&&String(job.date||'').slice(0,10)===selectedDate;
    if(!hasRecord&&!isScheduled&&isHistorical) return;
    if(!hasRecord&&!isScheduled&&!isFuture) return;
    if(isFuture&&!isScheduled) return;
    const status=isScheduled&&!hasRecord?'Scheduled':workEmployeeStatus(work,job,selectedDate,worker.id,activity||null);
    const total=type==='PIECE'?workTotalRequired(job,work):0;
    const overall=type==='PIECE'?workerWorkCompletedThroughDate(work,job,selectedDate,worker.id):0;
    const dayRecord=(work.workDayRecords||{})[key]||{};
    const progress=type==='PIECE'&&total>0?Math.min(100,Math.round((overall/total)*100)):0;
    rows.push({partName:job.partName,workName:workDisplayLabel(work,job),count,status,type,total,overall,remaining:Math.max(0,total-overall),progress,worked:dayRecord.worked===true,hours:dayRecord.hours});
  });
  const details=state.workerDateLoading?`<div class="worker-dashboard-empty">Loading work records for ${fmtDate(selectedDate)}…</div>`:state.workerDateRefreshError?`<div class="worker-dashboard-empty">Work records for the selected date could not be refreshed. Please select the date again to retry.</div>`:rows.map(x=>{
    const pieceBased=x.type==='PIECE';
    const quantityTracked=pieceBased&&x.total>0;
    const dailySummary=pieceBased?`${x.count} pieces`:x.worked?`Worked${Number(x.hours)>0?` · ${x.hours} hrs`:''}`:'No work recorded';
    const statusClass=x.status==='Completed'?'badge-green':x.status==='Scheduled'?'badge-blue':'badge-steel';
    const quantitySummary=quantityTracked?`<div class="worker-dashboard-work-meta"><div class="worker-work-daily"><small>Completed Today</small><strong>${x.count}</strong></div><div class="worker-work-pending"><small>Work Pending</small><strong>${x.remaining}</strong></div><div class="worker-work-total"><small>Total Assigned</small><strong>${x.total}</strong></div></div><div class="worker-dashboard-progress" role="group" aria-label="Work progress"><div class="worker-dashboard-progress-head"><span>Overall progress</span><strong>${x.overall} of ${x.total} pieces · ${x.progress}%</strong></div><div class="worker-dashboard-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${x.total}" aria-valuenow="${Math.min(x.overall,x.total)}" aria-label="${x.progress}% complete"><div class="worker-dashboard-progress-fill" style="width:${x.progress}%"></div></div></div>`:`<div class="worker-dashboard-work-meta"><div class="worker-work-daily"><small>Work on This Date</small><strong>${commonDashboardEscape(dailySummary)}</strong></div><div><small>Quantity Tracking</small><strong>${x.type==='WORK_BASED'?'Not applicable':'No fixed total'}</strong></div></div>`;
    return `<article class="worker-dashboard-work-card"><div class="worker-dashboard-work-title"><div class="worker-dashboard-work-heading"><span>${commonDashboardEscape(x.partName||'Work')}</span><b>${commonDashboardEscape(x.workName)}</b></div><span class="worker-dashboard-work-date">${fmtDate(selectedDate)}</span></div>${quantitySummary}<div class="worker-dashboard-work-foot"><span class="worker-dashboard-sub">${x.type==='WORK_BASED'?(x.worked?'Work recorded for this date':'No work recorded for this date'):quantityTracked?'Daily count and overall progress':'Daily count; no fixed quantity'}</span><span class="badge ${statusClass}">${commonDashboardEscape(x.status)}</span></div></article>`;
  }).join('')||`<div class="worker-dashboard-empty">No work records found for the selected date.</div>`;
  const attendanceStatusText=attendance?.inTime&&attendance?.outTime?'Completed':attendance?.inTime?'Checked In':'Not Recorded';
  const overviewTitle=selectedDate===today?"Today's Overview":isFuture?`Scheduled Work – ${fmtDate(selectedDate)}`:`Work Overview – ${fmtDate(selectedDate)}`;
  const detailsTitle=selectedDate===today?"Today's Work":isFuture?`Assigned Work – ${fmtDate(selectedDate)}`:`Work Details – ${fmtDate(selectedDate)}`;
  const workLinkLabel=selectedDate===today?'Open My Work':'View My Work';
  return `<div class="worker-dashboard-page">
    <div class="worker-dashboard-hero">
      <div><h2>${overviewTitle}</h2><div class="worker-dashboard-sub">Selected date: ${fmtDate(selectedDate)}</div></div>
      <div class="worker-dashboard-date"><label class="field-label">View Date</label><input class="field" id="worker-dash-date" type="date" value="${commonDashboardEscape(selectedDate)}"></div>
    </div>
    <div class="worker-dashboard-summary">
      <div class="worker-summary-card worker-summary-in"><span>In Time</span><strong>${fmtTime12(attendance?.inTime)}</strong></div>
      <div class="worker-summary-card worker-summary-out"><span>Out Time</span><strong>${fmtTime12(attendance?.outTime)}</strong></div>
      <div class="worker-summary-card worker-summary-status"><span>Attendance</span><strong>${attendanceStatusText}</strong><small>${fmtDate(selectedDate)}</small></div>
      <div class="worker-summary-card worker-summary-work"><span>Work Records</span><strong>${rows.length}</strong></div>
    </div>
    <div class="worker-dashboard-section">
      <div class="worker-dashboard-section-head"><div><h3>${detailsTitle}</h3></div><button class="btn btn-ghost btn-sm" data-wtab="work">${workLinkLabel}</button></div>
      <div class="worker-dashboard-work-grid">${details}</div>
    </div>
  </div>`;
}

function workerWork(worker){
  const selectedDate=todayStr();
  state.workerWorkDate=selectedDate;
  const myWork=[];
  state.workOrders.filter(job=>{const status=String(job?.status||'ACTIVE').toUpperCase();return !job?.isDeleted&&status!=='ARCHIVED'&&status!=='DONE'&&status!=='COMPLETED';}).forEach(job=>workEntries(job).forEach(work=>{if(workAssignedTo(work,worker.id))myWork.push({job,work});}));
  const rows=myWork.map(({job,work})=>{
    const type=normalizeWorkType(work.workType);
    const key=`${selectedDate}:${worker.id}`;
    const existing=Number((work.dailyCompleted||{})[key]||0);
    const dayRec=(work.workDayRecords||{})[key]||{};
    const current=Math.max(0,Number(existing||0));
    if(type==='WORK_BASED'){
      const checked=dayRec.worked===true?' checked':'';
      const timeVal=dayRec.hours!=null?dayRec.hours:'';
      return `<div class="wo-card worker-work-item"><div class="wo-top worker-work-head"><div><div class="wo-id">${job.partName||'Part'} · Work-Based</div><div class="wo-title">${job.partName||'Job'}</div><div class="wo-meta">${fmtDate(selectedDate)} · No piece counting</div></div></div><div class="wo-progress-wrap"><div class="form-row"><div><label class="field-label">Worked on ${fmtDate(selectedDate)}</label><label class="employee-check"><input type="checkbox" data-worker-worked="${job.id}:${work.id}"${checked}> <span>Worked</span></label></div><div><label class="field-label">Time Spent (hours)</label><input class="field" type="number" min="0.01" step="0.25" value="${timeVal}" data-worker-work-hours="${job.id}:${work.id}" ${dayRec.worked===true?'':'disabled'}></div></div></div></div>`;
    }
    const workTotal=workTotalRequired(job,work);
    const overallCompleted=Math.max(0,Number(work.completed||0));
    const workRemaining=Math.max(0,workTotal-overallCompleted);
    const maxForToday=Math.max(0,workRemaining+current);
    const imageHtml=type==='PIECE'&&job.image?`<img class="wo-img" src="${job.image}" alt="${job.partName}" data-lightbox="${job.image}">`:'';
    const isWorkComplete=type==='PIECE' && String(work.status||'ACTIVE').toUpperCase()==='DONE'; const todayStatus=isWorkComplete?'Completed':'Ongoing'; const pieceControls=isWorkComplete?`<div class="record-note"><b>Completed</b> · Count editing is locked</div>`:`<label class="field-label">Pieces completed on ${fmtDate(selectedDate)}</label><div class="qty-control worker-qty-control"><button type="button" class="btn btn-ghost qty-btn" data-worker-qty-dec="${job.id}:${work.id}" aria-label="Decrease completed count" ${current<=0?'disabled':''}>−</button><input class="qty-value worker-work-count" type="number" min="0" ${type==='PIECE'?`max="${maxForToday}"`:''} value="${current}" data-worker-work-count="${job.id}:${work.id}"><button type="button" class="btn btn-ghost qty-btn" data-worker-qty-inc="${job.id}:${work.id}" aria-label="Increase completed count" ${type==='PIECE'&&current>=maxForToday?'disabled':''}>+</button></div><div class="record-note"><b>${todayStatus}</b></div>`;
    return `<div class="wo-card worker-work-item"><div class="wo-top worker-work-head">${imageHtml}<div><div class="wo-id">${job.partName||'Part'} · ${type==='PIECE'?'Pieces Based':'No Fixed Total Pieces'}</div><div class="wo-title">${workDisplayLabel(work,job)}</div><div class="wo-meta">${type==='PIECE'?`Work Completed ${overallCompleted} · Work Remaining ${workRemaining} · Work Total ${workTotal}`:'No fixed total · daily piece counts are retained separately'}</div></div></div><div class="wo-progress-wrap">${pieceControls}</div></div>`;
  }).join('')||`<div class="empty-state"><div class="mark"></div>No Work assigned to you yet. Check back soon.</div>`;
  return `<div class="panel worker-my-work-panel"><div class="panel-head"><div><h3>My Work</h3></div><div><label class="field-label">Date</label><div class="field" style="background:var(--panel-alt);font-weight:700;pointer-events:none;user-select:none" aria-label="Today's date">${fmtDate(selectedDate)}</div></div></div>${rows}<div style="display:flex;justify-content:center;margin-top:14px"><button class="btn btn-primary" id="worker-work-common-save" ${myWork.some(({work})=>normalizeWorkType(work.workType)!=='PIECE'||String(work.status||'ACTIVE').toUpperCase()!=='DONE')?'':'disabled'}>Save / Update</button></div></div>`;
}

  const history=state.attendance.filter(a=>String(a.employeeId)===String(worker.id)&&a.date===today).map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${fmtTime12(a.inTime)}</td><td>${fmtTime12(a.outTime)}</td><td><span class="badge ${statusBadgeClass(attendanceStatus(worker.id,a.date))}">${attendanceStatus(worker.id,a.date)}</span></td></tr>`).join('') || `<tr class="empty-row"><td colspan="4">No attendance recorded.</td></tr>`;

function invoiceMoney(value){
  const n=Number(value);
  return Number.isFinite(n)?Math.round((n+Number.EPSILON)*100)/100:0;
}
function invoiceItemsNormalized(record){
  const inwardId=String(record?.id||'').trim();
  const normalizeItem=(i,index=0)=>{
    const partName=String(i?.partName ?? i?.part ?? i?.itemName ?? i?.name ?? '').trim();
    const quantity=Number(i?.quantity ?? i?.qty ?? i?.totalQuantity ?? 0);
    if(!partName || !Number.isFinite(quantity) || quantity<=0) return null;
    const rawPerUnit=Number(i?.perUnitAmount ?? i?.unitAmount ?? i?.rate ?? i?.perPieceAmount);
    const rawLegacyAmount=Number(i?.amount ?? i?.partAmount ?? i?.totalAmount);
    const hasPerUnit=Number.isFinite(rawPerUnit) && rawPerUnit>=0;
    const perUnitAmount=hasPerUnit?invoiceMoney(rawPerUnit):(Number.isFinite(rawLegacyAmount)&&rawLegacyAmount>=0?invoiceMoney(rawLegacyAmount/quantity):0);
    const partAmount=hasPerUnit?invoiceMoney(quantity*perUnitAmount):(Number.isFinite(rawLegacyAmount)&&rawLegacyAmount>=0?invoiceMoney(rawLegacyAmount):0);
    const itemId=String(i?.itemId||i?.id||'').trim() || (inwardId?`${inwardId}:item:${index}`:'');
    return {itemId,partName,hsnNumber:String(i?.hsnNumber??i?.hsn??'').trim(),quantity,perUnitAmount,amount:partAmount,weight:i?.weight??'',uom:String(i?.uom??i?.unit??'').trim(),remarks:String(i?.remarks??'').trim()};
  };
  const raw=Array.isArray(record?.items)?record.items:[];
  const items=raw.map((item,index)=>normalizeItem(item,index)).filter(Boolean);
  if(items.length) return items;
  const partName=String(record?.partName ?? record?.part ?? record?.itemName ?? record?.name ?? '').trim();
  const quantity=Number(record?.quantity ?? record?.qty ?? record?.totalQuantity ?? 0);
  if(!partName || !Number.isFinite(quantity) || quantity<=0) return [];
   const item=normalizeItem({itemId:inwardId?`${inwardId}:item:0`:'',partName,hsnNumber:record?.hsnNumber??record?.hsn,quantity,perUnitAmount:record?.perUnitAmount,amount:record?.amount,weight:record?.weight,uom:record?.uom,remarks:record?.remarks},0);
  return item?[item]:[];
}
function normalizeInwardStatus(value){ const v=String(value||'Pending').trim().toLowerCase(); if(v==='completed')return 'Completed'; if(v==='cancelled'||v==='canceled')return 'Cancelled'; if(v==='missing parts'||v==='missing_parts')return 'Missing Parts'; return 'Pending'; }
function pendingInwardEntries(){
  const out=[];
  (state.invoices||[]).filter(x=>x&&x.isDeleted!==true&&String(x.type||'').toUpperCase()==='INWARD'&&String(x.status||'Pending')==='Pending').forEach(inward=>{
    const items=invoiceItemsNormalized(inward);
    items.forEach((item,index)=>{
      const itemId=String(item.itemId||`${inward.id}:item:${index}`).trim();
      const customerDcNumber=String(inward.customerDcNumber||inward.dcNumber||inward.number||'').trim();
      if(!customerDcNumber||!item.partName)return;
      out.push({inward,inwardId:String(inward.id),item,itemId,customerDcNumber,jobName:item.partName,pendingQuantity:Number(item.quantity||0)});
    });
  });
  return out;
}
function pendingInwardEntriesForDc(customerDcNumber){

function pendingInwardEntryForJob(job){

  const dc=String(job?.customerDcNumber||'').trim();

function pendingInwardJobProgress(entry){
  const inwardId=String(entry?.inwardId||'').trim();
  const itemId=String(entry?.itemId||'').trim();
  let source=null;

    source=[...(state.workOrders||[]),...(state.workHistory||[])].find(job=>!isDeletedWorkOrderSnapshot(job)&&String(job?.inwardId||'')===inwardId&&String(job?.inwardItemId||'')===itemId)||null;
  }

function invoiceHasAmounts(record){
  return String(record?.documentType||'').toUpperCase()==='INVOICE' && invoiceItemsNormalized(record).some(i=>Number.isFinite(i.amount));
}
function invoiceCalculation(record){
  const items=invoiceItemsNormalized(record);
  const applicable=String(record?.documentType||'').toUpperCase()==='INVOICE' && items.length>0 && items.some(i=>Number.isFinite(i.amount));
  if(!applicable) return {applicable:false,subtotal:null,gstPercentage:null,gstAmount:null,totalAmount:null,paymentStatus:String(record?.paymentStatus||'').trim()};
  const subtotal=invoiceMoney(items.reduce((sum,i)=>sum+(Number.isFinite(i.amount)?invoiceMoney(i.amount):0),0));
  const gstPercentage=Number.isFinite(Number(record?.gstPercentage))?invoiceMoney(record.gstPercentage):18;
  const gstAmount=invoiceMoney(subtotal*gstPercentage/100);
  const totalAmount=invoiceMoney(subtotal+gstAmount);
  return {applicable:true,subtotal,gstPercentage,gstAmount,totalAmount,paymentStatus:String(record?.paymentStatus||'').trim()};
}

    {key:'invoiceNumber',label:'Invoice Number',type:'text',value:x=>String(x.type||'').toUpperCase()==='INWARD'?'':(String(x.documentType||'').toUpperCase()==='INVOICE'?(x.number||x.documentNumber||''): '')},
    {key:'dcNumber',label:'DC Number',type:'text',value:x=>String(x.type||'').toUpperCase()==='INWARD'?(x.dcNumber||''):(String(x.documentType||'').toUpperCase()==='DC'?(x.number||x.documentNumber||''):'')},

    {key:'quantity',label:'Qty',type:'number',value:x=>invoiceItemsNormalized(x).reduce((sum,i)=>sum+Number(i.quantity||0),0)},
    {key:'subtotal',label:'Subtotal',type:'number',value:x=>{const c=invoiceCalculation(x);return c.applicable?Number(c.subtotal):null;}},
    {key:'gstPercentage',label:'GST %',type:'number',value:x=>{const c=invoiceCalculation(x);return c.applicable?Number(c.gstPercentage):null;}},
    {key:'gstAmount',label:'GST Amount',type:'number',value:x=>{const c=invoiceCalculation(x);return c.applicable?Number(c.gstAmount):null;}},
    {key:'totalAmount',label:'Total Amount',type:'number',value:x=>{const c=invoiceCalculation(x);return c.applicable?Number(c.totalAmount):null;}},
    {key:'paymentStatus',label:'Payment Status',type:'text',value:x=>{const c=invoiceCalculation(x);return c.applicable?(c.paymentStatus||''):'';}},
    {key:'inwardStatus',label:'Inwards Status',type:'text',value:x=>String(x.type||'').toUpperCase()==='INWARD'?(x.status||'Pending'):''},

function invoiceSavedRecordSortValue(value,type){
  if(type==='number'){
    const n=Number(value); return Number.isFinite(n)?n:null;
  }
  if(type==='date'){
    const s=String(value||'').trim(); if(!s)return null; const t=Date.parse(s+'T00:00:00'); return Number.isFinite(t)?t:null;
  }
  return String(value??'').trim().toLocaleLowerCase();
}
function invoiceSavedRecordFilterMatch(value,filter,type){
  if(!filter || !filter.mode)return true;
  if(filter.mode==='sort-asc'||filter.mode==='sort-desc')return true;
  const raw=String(filter.value??'').trim();
  if(type==='number'){
    const n=Number(value), target=Number(raw);
    if(!Number.isFinite(target))return false;
    if(filter.mode==='equals')return Number.isFinite(n)&&n===target;
    return Number.isFinite(n)&&String(n).includes(String(target));
  }
  if(type==='date'){
    const actual=String(value??'').trim();
    if(filter.mode==='equals')return actual===raw;
    return actual.toLowerCase().includes(raw.toLowerCase());
  }
  const actual=String(value??'').toLocaleLowerCase(),needle=raw.toLocaleLowerCase();
  if(filter.mode==='equals')return actual===needle;
  return actual.includes(needle);
}
function invoiceSavedRecordsView(){
  const columns=invoiceSavedRecordColumns();
  const filters=state.invoiceSavedRecordsFilters||{};
  let records=(state.invoices||[]).filter(x=>x&&x.isDeleted!==true);
  const dateFilters=state.invoiceSavedDateFilters||{};
  records=records.filter(record=>savedDateFilterMatch(record,'invoices',dateFilters));
  records=records.filter(record=>columns.every(col=>invoiceSavedRecordFilterMatch(col.value(record),filters[col.key],col.type)));
  const activeSort=columns.map((col,index)=>({col,index,filter:filters[col.key]})).find(x=>x.filter?.mode==='sort-asc'||x.filter?.mode==='sort-desc');
  if(activeSort){
    const direction=activeSort.filter.mode==='sort-desc'?-1:1;
    records=[...records].sort((a,b)=>{
      const av=invoiceSavedRecordSortValue(activeSort.col.value(a),activeSort.col.type),bv=invoiceSavedRecordSortValue(activeSort.col.value(b),activeSort.col.type);
      if(av===bv)return 0;
      if(av===null)return 1;
      if(bv===null)return -1;
      return (av<bv?-1:1)*direction;
    });
  }else{
    records=[...records].sort((a,b)=>(String(b.date||'').localeCompare(String(a.date||''))||String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''))));
  }
  return {columns,records};
}
function invoiceSavedFilterMenu(col,index,filter){
  const active=filter&&filter.mode;
  const mode=filter?.mode&&filter.mode!=='sort-asc'&&filter.mode!=='sort-desc'?filter.mode:'';
  const value=filter?.value||'';
  return `<div class="invoice-filter-head"><span>${col.label}</span><button type="button" class="invoice-filter-btn ${active?'active':''}" data-invoice-filter-toggle="${index}" aria-label="Filter ${commonDashboardEscape(col.label)}">${active?'Filtered':'Filter'} ▾</button></div><div class="invoice-filter-menu" data-invoice-filter-menu="${index}" hidden><label class="field-label">Action</label><select class="field" data-invoice-filter-mode="${index}"><option value="">Choose action</option><option value="sort-asc" ${filter?.mode==='sort-asc'?'selected':''}>Sort Ascending</option><option value="sort-desc" ${filter?.mode==='sort-desc'?'selected':''}>Sort Descending</option><option value="contains" ${mode==='contains'?'selected':''}>Contains</option><option value="equals" ${mode==='equals'?'selected':''}>Equals</option></select><label class="field-label">Value</label><input class="field" data-invoice-filter-value="${index}" value="${commonDashboardEscape(value)}" placeholder="${col.type==='date'?'YYYY-MM-DD':col.type==='number'?'Enter number':'Enter value'}" ${mode?'':'disabled'}><div class="invoice-filter-actions"><button type="button" class="btn btn-ghost btn-sm" data-invoice-filter-clear="${index}">Clear</button><button type="button" class="btn btn-primary btn-sm" data-invoice-filter-apply="${index}">Apply</button></div></div>`;
}

function attachWorkerEvents(){
  const logoutBtnM = document.getElementById('logout-btn-m'); if(logoutBtnM) logoutBtnM.addEventListener('click', logout);
  const applyDashboardFilters=()=>{const from=document.getElementById('df-from')?.value||'',to=document.getElementById('df-to')?.value||'';if(dateRangeMonthsExceeded(from,to)){showToast(`Date range cannot exceed ${MAX_DATE_RANGE_MONTHS} months`);return;}state.dashboardFilters={from,to,employeeId:document.getElementById('df-employee')?.value||'',recordType:document.getElementById('df-record-type')?.value||''};render();};
  ['df-from','df-to','df-employee','df-record-type'].forEach(id=>{const el=document.getElementById(id); if(el) el.addEventListener('change',applyDashboardFilters);});
  const dfToggle=document.getElementById('dashboard-filter-toggle'); if(dfToggle) dfToggle.addEventListener('click',()=>{state.dashboardFiltersOpen=!state.dashboardFiltersOpen;render();});
  const dfClear=document.getElementById('dashboard-filter-clear'); if(dfClear) dfClear.addEventListener('click',()=>{state.dashboardFilters={from:'',to:'',employeeId:'',recordType:''};render();});

  document.querySelectorAll('[data-wtab]').forEach(el=>el.addEventListener('click', ()=>{ const nextTab=el.dataset.wtab; if(!WORKER_ALLOWED_TABS.has(nextTab)) return; state.workerTab = nextTab; render(); }));
  const loadWorkerSelectedDate=async value=>{const selected=/^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?String(value):todayStr();state.workerDashDate=selected;state.workerWorkDate=selected;state.workerDateLoading=true;state.workerDateRefreshError='';const requestId=state.workerDateLoadVersion=(state.workerDateLoadVersion||0)+1;render();const [orders,history]=await Promise.all([safeGet('fl_workorders'),safeGet('fl_workhistory')]);if(requestId!==state.workerDateLoadVersion)return;if(orders===SAFE_GET_FAILED||history===SAFE_GET_FAILED){state.workerDateRefreshError='Unable to refresh selected-date work records.';}else{state.workOrders=(orders||[]).map(normalizeWorkJob);state.workHistory=remapEmployeeReferences(history||[],new Map(state.employees.map(e=>[employeeId(e),employeeId(e)])));}state.workerDateLoading=false;render();};
  const workerDashDate=document.getElementById('worker-dash-date'); if(workerDashDate) workerDashDate.addEventListener('change',()=>void loadWorkerSelectedDate(workerDashDate.value));
  const workerPiecesDate=document.getElementById('worker-pieces-date'); if(workerPiecesDate) workerPiecesDate.addEventListener('change',async()=>{state.workerPiecesDate=workerPiecesDate.value||todayStr();const latest=await safeGet('fl_workorders');if(latest!==SAFE_GET_FAILED)state.workOrders=(latest||[]).map(normalizeWorkJob);render();});
  document.querySelectorAll('[name="w-time-method"]').forEach(r=>r.addEventListener('change',()=>{const manual=document.querySelector('input[name="w-time-method"]:checked')?.value!=='clock';const ma=document.getElementById('w-manual-area'),ca=document.getElementById('w-clock-area');if(ma)ma.style.display=manual?'block':'none';if(ca)ca.style.display=manual?'none':'block';}));

  document.querySelectorAll('[data-drawer-nav]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.attr==='tab'){state.workerTab=el.dataset.drawerNav;state.drawerOpen=false;render();}}));
  const wIn = document.getElementById('w-in'); if(wIn) wIn.addEventListener('click', async ()=>{ await punch(state.currentWorkerId,'in'); render(); });
  const wOut = document.getElementById('w-out'); if(wOut) wOut.addEventListener('click', async ()=>{ await punch(state.currentWorkerId,'out'); render(); });

  document.querySelectorAll('[data-worker-qty-inc],[data-worker-qty-dec]').forEach(el=>el.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();
    const key=String(el.dataset.workerQtyInc||el.dataset.workerQtyDec||'');
    const input=document.querySelector(`[data-worker-work-count="${key}"]`);
    if(!input) return;
    const jobId=key.split(':')[0]; const job=state.workOrders.find(j=>j.id===jobId); const type=input.closest('.worker-work-item')?.querySelector('[data-worker-work-count]')?normalizeWorkType(findWorkEntry(job,key.split(':')[1])?.workType):'PIECE';
    const work=findWorkEntry(job,key.split(':')[1]); if(!work||String(work.status||'ACTIVE').toUpperCase()==='DONE')return; const current=Math.max(0,Number(input.value||0)); const existing=Number((work.dailyCompleted||{})[todayStr()+':'+state.currentWorkerId]||0); const overall=Math.max(0,Number(work.completed||0)); const total=workTotalRequired(job,work); const max=type==='PIECE'&&job?Math.max(0,total-Math.max(0,overall-existing)):Infinity;
    const next=el.dataset.workerQtyInc?Math.min(max,current+1):Math.max(0,current-1);
    input.value=next;
    const card=input.closest('.worker-work-item');
    card?.querySelectorAll('[data-worker-qty-inc],[data-worker-qty-dec]').forEach(btn=>{
      if(btn.hasAttribute('data-worker-qty-inc')) btn.disabled=type==='PIECE'&&next>=max;
      else btn.disabled=next<=0;
    });
  }));

  const workerCommonSave=document.getElementById('worker-work-common-save');
  if(workerCommonSave) workerCommonSave.addEventListener('click',async()=>{
    if(workerCommonSave.dataset.saving==='1') return;
    workerCommonSave.dataset.saving='1'; workerCommonSave.disabled=true;
    const originalLabel=workerCommonSave.textContent; workerCommonSave.textContent='Saving…';

    const date=todayStr(); state.workerWorkDate=date;
    try{
      // Validate all hour entries before sending any writes.
      for(const input of document.querySelectorAll('[data-worker-worked]')){
        if(!input.checked) continue;
        const key=String(input.dataset.workerWorked||'');
        const hoursInput=document.querySelector(`[data-worker-work-hours="${key}"]`);
        const rawHours=hoursInput?.value??''; const hours=Number(rawHours);
        if(!String(rawHours).trim() || !Number.isFinite(hours) || hours<=0){ showToast('Please enter the time/hours worked before updating the status.'); hoursInput?.focus(); return; }
      }

      const pieceChanges=[];
      for(const input of document.querySelectorAll('[data-worker-work-count]')){
        const parts=String(input.dataset.workerWorkCount||'').split(':'); const jobId=parts[0], workId=parts.slice(1).join(':');
        const job=state.workOrders.find(j=>String(j.id)===jobId); const work=findWorkEntry(job,workId); if(!job||!work) continue;
        const type=normalizeWorkType(work.workType); if(type!=='PIECE'||String(work.status||'ACTIVE').toUpperCase()==='DONE') continue;
        const raw=String(input.value??'').trim(); const entered=raw===''?0:Number(raw);
        if(!Number.isFinite(entered)||!Number.isInteger(entered)||entered<0){showToast('Enter a valid non-negative whole number of pieces.');input.focus();return;}
        const key=date+':'+state.currentWorkerId; const already=Math.max(0,Number((work.dailyCompleted||{})[key]||0));
        const total=workTotalRequired(job,work); const overallExcludingCurrent=Math.max(0,Number(work.completed||0)-already); const allowedMax=Math.max(0,total-overallExcludingCurrent);
        if(entered>allowedMax){showToast(`Maximum allowed for this Work is ${allowedMax} pieces. Work total cannot be exceeded.`);input.focus();return;}
        if(entered!==already) pieceChanges.push({jobId,workId,finalCount:entered,input});
      }

      // Save each piece count through the server's atomic, ID-scoped endpoint.
      // This avoids sending a stale full Work Orders array and prevents repeated
      // saves from adding the same count twice.
      for(const change of pieceChanges){
        const response=await fetch(SOV_API_BASE_URL+'/api/workorders/'+encodeURIComponent(change.jobId)+'/worker-count',{
          method:'POST',headers:authHeaders({'Content-Type':'application/json'}),
          body:JSON.stringify({workId:change.workId,date,finalCount:change.finalCount,expectedDailyCount:Math.max(0,Number((findWorkEntry(state.workOrders.find(j=>String(j.id)===change.jobId),change.workId)?.dailyCompleted||{})[date+':'+state.currentWorkerId]||0)),requestId:uid('worker-count')})
        });
        const result=await response.json().catch(()=>({}));
        if(!response.ok||!result.ok) throw new Error(result.error||`Could not save count for Work ${change.workId}.`);
      }

      // Reload after atomic count updates before applying work-day/hour edits,
      // so the following general state write cannot overwrite the fresh counts.
      let latest=await safeGet('fl_workorders');
      if(latest===SAFE_GET_FAILED) throw new Error(pieceChanges.length?'Count was saved, but latest work data could not be reloaded. Retry refresh before making more changes.':'Could not load current Work Orders. Please retry.');
      state.workOrders=(latest||[]).map(normalizeWorkJob);

      let otherChanged=false;
      // Non-piece work counts retain their existing behavior, but operate on
      // freshly loaded records rather than a stale browser snapshot.
      for(const input of document.querySelectorAll('[data-worker-work-count]')){
        const parts=String(input.dataset.workerWorkCount||'').split(':'); const jobId=parts[0], workId=parts.slice(1).join(':');
        const job=state.workOrders.find(j=>String(j.id)===jobId); const work=findWorkEntry(job,workId); if(!job||!work) continue;
        const type=normalizeWorkType(work.workType); if(type==='PIECE'||String(work.status||'ACTIVE').toUpperCase()==='DONE') continue;
        if(type!=='NO_FIXED') continue;
        const entered=Math.max(0,Number(input.value||0)); const key=date+':'+state.currentWorkerId; const already=Math.max(0,Number((work.dailyCompleted||{})[key]||0));
        if(entered===already) continue;
        work.dailyCompleted=work.dailyCompleted||{}; work.completionHistory=Array.isArray(work.completionHistory)?work.completionHistory.filter(x=>!(x.date===date&&String(x.employeeId)===String(state.currentWorkerId))):[];
        if(entered>0){work.dailyCompleted[key]=entered;work.dailyCompletedDeletions=Array.isArray(work.dailyCompletedDeletions)?work.dailyCompletedDeletions:[];work.dailyCompletedDeletions=work.dailyCompletedDeletions.filter(x=>String(x)!==key);work.notWorkedRecordDeletions=Array.isArray(work.notWorkedRecordDeletions)?work.notWorkedRecordDeletions:[];if(!work.notWorkedRecordDeletions.includes(key))work.notWorkedRecordDeletions.push(key);work.completionHistory.push({id:uid('wch'),workId:work.id,employeeId:state.currentWorkerId,date,workName:workLabel(work,job),pieces:entered,recordedAt:Date.now()});}
        else{delete work.dailyCompleted[key];work.dailyCompletedDeletions=Array.isArray(work.dailyCompletedDeletions)?work.dailyCompletedDeletions:[];if(!work.dailyCompletedDeletions.includes(key))work.dailyCompletedDeletions.push(key);}
        otherChanged=true;
      }

      for(const input of document.querySelectorAll('[data-worker-worked]')){
        const parts=String(input.dataset.workerWorked||'').split(':'); const jobId=parts[0], workId=parts.slice(1).join(':');
        const job=state.workOrders.find(j=>String(j.id)===jobId); const work=findWorkEntry(job,workId); if(!job||!work) continue;
        const key=date+':'+state.currentWorkerId; const hoursInput=document.querySelector(`[data-worker-work-hours="${jobId}:${workId}"]`);
        const worked=input.checked; const rawHours=hoursInput?.value??''; const hours=worked?Number(rawHours):0;
        work.workDayRecords=work.workDayRecords||{}; work.notWorkedRecords=Array.isArray(work.notWorkedRecords)?work.notWorkedRecords:[];
        const prev=work.workDayRecords[key]||{}; const hadMarker=work.notWorkedRecords.some(x=>String(x?.date)===date&&String(x?.employeeId)===String(state.currentWorkerId));
        const hasSame=worked ? (prev.worked===true&&Number(prev.hours)===hours) : (!prev.worked&&hadMarker);
        if(hasSame) continue;
        if(worked&&hours>0){work.workDayRecords[key]={worked:true,hours,employeeId:state.currentWorkerId,date,updatedAt:Date.now()};work.notWorkedRecords=work.notWorkedRecords.filter(x=>!(String(x?.date)===date&&String(x?.employeeId)===String(state.currentWorkerId)));work.notWorkedRecordDeletions=Array.isArray(work.notWorkedRecordDeletions)?work.notWorkedRecordDeletions:[];if(!work.notWorkedRecordDeletions.includes(key))work.notWorkedRecordDeletions.push(key);}
        else{delete work.workDayRecords[key];work.workDayRecordDeletions=Array.isArray(work.workDayRecordDeletions)?work.workDayRecordDeletions:[];if(!work.workDayRecordDeletions.includes(key))work.workDayRecordDeletions.push(key);if(!worked&&!hadMarker)work.notWorkedRecords.push({employeeId:state.currentWorkerId,date,updatedAt:Date.now()});}
        otherChanged=true;
      }

      if(otherChanged){const saved=await persist('workOrders','fl_workorders');if(!saved)throw new Error('Work activity details could not be saved. Please retry.');}
      if(pieceChanges.length||otherChanged){showToast('Work updates saved');render();}
      else showToast('No work updates to save');
    }catch(err){console.error('Worker My Work save failed:',err);showToast(err.message||'Work updates could not be saved. Please retry.');}
    finally{workerCommonSave.dataset.saving='';workerCommonSave.disabled=false;workerCommonSave.textContent=originalLabel;}
  });
  document.querySelectorAll('[data-worker-worked]').forEach(input=>input.addEventListener('change',()=>{const key=input.dataset.workerWorked;const hours=document.querySelector(`[data-worker-work-hours="${key}"]`);if(hours)hours.disabled=!input.checked;}));


  const wManualSave = document.getElementById('w-manual-save');
  if(wManualSave) wManualSave.addEventListener('click', async ()=>{
    const date = todayStr();
    const inVal = document.getElementById('w-manual-in').value;
    const outVal = document.getElementById('w-manual-out').value;
    let rec = state.attendance.find(a=>a.employeeId===state.currentWorkerId && a.date===date);
    if(!rec){ rec = {id:uid('att'), employeeId:state.currentWorkerId, date, inTime:'', outTime:''}; state.attendance.push(rec); }
    rec.inTime = normalizeTimeValue(inVal); rec.outTime = normalizeTimeValue(outVal); rec.updatedAt = new Date().toISOString();
    const saved=await persist('attendance','fl_attendance');
    if(saved){showToast('Attendance saved'); render();}
  });

  const permFormW = document.getElementById('perm-form-w');
  if(permFormW) permFormW.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(permFormW);
    const outTime=time12To24(fd.get('outTime')); const inTime=time12To24(fd.get('inTime'));
    if(!outTime || (fd.get('inTime') && !inTime)){showToast('Enter permission time as HH:MM AM/PM');return;}
    state.permissions.push({id:uid('perm'), employeeId:state.currentWorkerId, date:todayStr(), outTime, inTime:inTime||'', reason:String(fd.get('reason')||'').trim(), status:'pending', requestedBy:'worker'});
    const saved=await persist('permissions','fl_permissions');
    if(saved){showToast('Permission request submitted'); render();}
  });

  const leaveFormW = document.getElementById('leave-form-w');
  if(leaveFormW) leaveFormW.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(leaveFormW.dataset.saving==='1') return;
    leaveFormW.dataset.saving='1';
    try{
      const fd = new FormData(leaveFormW);
      const now=new Date().toISOString();
      const startDate=String(fd.get('startDate')||'').trim(); const endDate=String(fd.get('endDate')||'').trim();
      const reason=String(fd.get('reason')||'').trim();
      if(!startDate||!endDate||endDate<startDate){showToast('Enter a valid leave date range');return;}
      const request={id:uid('lv'),employeeId:state.currentWorkerId,startDate,endDate,requestDate:now.slice(0,10),requestedAt:now,createdAt:now,updatedAt:now,reason,status:'pending',requestedBy:'worker'};
      state.leaves.push(request);
      const saved=await persist('leaves','fl_leaves');
      if(saved){showToast('Leave request submitted');render();}else{state.leaves=state.leaves.filter(x=>x.id!==request.id);render();}
    }finally{leaveFormW.dataset.saving='';}
  });

}

/* ================= INIT ================= */
if(restoreAdminSession()){
  loadAuthenticatedState().then(()=>{ loadAll(); }).catch((error)=>{
    // Do not log out a valid Admin session because a dependent data source is
    // temporarily unavailable. Clear the session only for 401/403 responses.
    if(isAuthenticationFailure(error)){
      clearAdminSession();
      state.role=null; state.authToken=null; state.authRole=null; state.authUserName=null; state.currentEmployeeId=null;
    }
    loadAll();
  });
}else{
  loadAll();
}
</script>
<style id="global-zebra-table-rows">
  /* Consistent accessible zebra striping for data tables across all app areas.
     Keep badges/status chips and row hover/selection overlays intact. */
  table:not(.no-zebra) > tbody > tr:nth-child(odd) > td { background-color:#ffffff; }
  table:not(.no-zebra) > tbody > tr:nth-child(even) > td { background-color:#f1f6fc; }
  table:not(.no-zebra) > tbody > tr:hover > td { background-color:#e4effb; }
  table:not(.no-zebra) > tbody > tr[aria-selected="true"] > td,
  table:not(.no-zebra) > tbody > tr.selected > td,
  table:not(.no-zebra) > tbody > tr.is-selected > td { background-color:#d9e9fb; }
  table:not(.no-zebra) > tbody > tr > td { transition:background-color .12s ease; }
</style>
</body>
